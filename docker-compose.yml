services:
  web:
    build:
      context: ./landingpage
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - riralicense

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Bound to loopback only so host cloudflared can reach Caddy without exposing ports publicly
    ports:
      - "127.0.0.1:${CADDY_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - riralicense

networks:
  riralicense:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

