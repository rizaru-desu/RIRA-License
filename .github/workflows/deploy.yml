# Required GitHub Secrets (in Settings -> Environments -> production -> Environment secrets,
# or Settings -> Secrets and variables -> Actions -> Repository secrets):
#   - TAILSCALE_OAUTH_CLIENT_ID     : Tailscale OAuth client ID (with auth_keys write scope for tag:ci)
#   - TAILSCALE_OAUTH_CLIENT_SECRET : Tailscale OAuth client secret
#   - SERVER_HOST                   : Server Tailscale IP (100.x.y.z) or MagicDNS hostname
#   - SERVER_PORT                   : Custom SSH port on the server (e.g. 7022)
#   - SERVER_USER                   : SSH username on the server
#   - SSH_PRIVATE_KEY               : Private SSH key authorized on the server
#
# Note: GITHUB_TOKEN is provided automatically by GitHub Actions for GHCR pushes.

name: Deploy Landing Page

on:
  push:
    branches:
      - main
    paths:
      - 'landingpage/**'
      - 'landingpage/Dockerfile'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build & Push Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: ./landingpage
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/rizaru-desu/rira-license-web:latest
            ghcr.io/rizaru-desu/rira-license-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server via Tailscale
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://license.rira.web.id
    steps:
      - name: Checkout compose and Caddy files
        uses: actions/checkout@v4

      - name: Connect to Tailscale tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Copy compose and Caddyfile to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || '7022' }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: "/srv/compose/license.riralabs/"
          overwrite: true

      - name: Pull image and restart stack via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || '7022' }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p /srv/compose/license.riralabs
            cd /srv/compose/license.riralabs
            docker compose pull web
            docker compose up -d
            docker compose ps
            docker compose exec -T caddy wget -qO- --header="Host: license.rira.web.id" http://localhost/ | grep -q RiraLicense

      - name: Verify public HTTPS endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://license.rira.web.id/)
          echo "HTTP status for https://license.rira.web.id/: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Expected HTTP 200 from https://license.rira.web.id/, got $status"
            exit 1
          fi
